name: Release

# Uruchamiane tagiem: git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# REL-01: token domyślnie tylko do odczytu; zapis (wydanie) wyłącznie w jobie publish,
# a podpis pochodzenia binarek (Sigstore) wyłącznie w jobie build.
permissions:
  contents: read

jobs:
  build:
    name: Binarka — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write       # OIDC dla podpisu Sigstore
      attestations: write   # zapis atestacji pochodzenia
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: top-antywir-linux-x86_64
          - os: windows-latest
            asset: top-antywir-windows-x86_64.exe
          - os: macos-latest
            asset: top-antywir-macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalacja
        run: |
          python -m pip install --upgrade pip
          # Przypięta wersja narzędzia, które wbudowuje kod do wydawanej binarki.
          python -m pip install "pyinstaller==6.22.3"
          python -m pip install -e . --no-deps

      - name: Build
        run: >
          pyinstaller --onefile --console --name top-antywir
          --paths .
          --collect-submodules top_antywir
          --exclude-module customtkinter
          --exclude-module tkinter
          --exclude-module PIL
          packaging/entry_cli.py

      - name: Sprawdź binarkę przed publikacją
        # Ta sama weryfikacja co w CI — wydanie nie może zawierać binarki,
        # której nikt nie uruchomił. `scan` zwraca 2 przy infekcji (kontrakt
        # opisany w README), więc pod `set -e` kod trzeba przechwycić.
        shell: bash
        run: |
          BIN=dist/top-antywir
          [ -f "dist/top-antywir.exe" ] && BIN=dist/top-antywir.exe
          "$BIN" --version

          mkdir -p smoke
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > smoke/eicar.txt

          set +e
          "$BIN" scan smoke > out.txt 2>&1
          code=$?
          set -e

          cat out.txt
          [ "$code" -eq 2 ]
          grep -q "EICAR-Test-File" out.txt

      - name: Nazwij plik zgodnie z platformą
        shell: bash
        run: |
          mkdir -p upload
          if [ -f dist/top-antywir.exe ]; then
            cp dist/top-antywir.exe "upload/${{ matrix.asset }}"
          else
            cp dist/top-antywir "upload/${{ matrix.asset }}"
          fi

      - name: Atestacja pochodzenia binarki (Sigstore)
        # Weryfikacja przez użytkownika: gh attestation verify <plik> --repo <owner>/top-antywir
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: upload/${{ matrix.asset }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: upload/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ręczne uruchomienie (workflow_dispatch) buduje i sprawdza binarki,
    # ale nie tworzy wydania — wydanie powstaje tylko z tagu.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # tylko ten job tworzy wydanie
    steps:
      # gh release potrzebuje repozytorium w katalogu roboczym.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Suma kontrolna
        # Binarka antywirusa pobrana z internetu bez sumy kontrolnej to
        # dokładnie ten scenariusz, przed którym ten program ostrzega.
        run: |
          cd artifacts
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Opublikuj wydanie
        # `gh` jest preinstalowane na runnerach GitHuba, więc wydanie
        # powstaje bez zewnętrznej akcji — o jedną zależność, której trzeba
        # ufać, mniej.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            artifacts/*
